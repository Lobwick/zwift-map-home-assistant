name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Custom integrations are not in home-assistant/brands; description
          # and topics are repository settings on GitHub.
          ignore: brands description topics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - run: |
          FRONTEND=$(python -c "import json, homeassistant.components.frontend as f, pathlib; m = json.loads((pathlib.Path(f.__file__).parent / 'manifest.json').read_text()); print(m['requirements'][0])")
          pip install "$FRONTEND"
      - run: pytest -q
